<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shall and Life School - Teacher Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #333;
    }
    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    button {
      width: 95%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background-color: #42af2;
    }
    p {
      margin-top: 15px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h1>Shallom and Life School</h1>
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p>Welcome, teacher! Enter your phone number and password to continue.</p>
  </div>

  <script>
    function login() {
      const phone = document.getElementById("phone").value;
      const password = document.getElementById("password").value;

      if(phone && password){
        // Save teacher login locally (simple version)
        localStorage.setItem("teacher", phone);
        // Redirect to dashboard
        window.location.href = "dashboard.html";
      } else {
        alert("Please enter phone number and password.");
      }
    }
  </script>

</body>
</html>
